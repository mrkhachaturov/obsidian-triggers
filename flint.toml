[settings]
exclude = [
  # Prose with deliberate line breaks; a markdown fixer reflows them into a
  # different document.
  "AGENTS.md",
  # One line: `@AGENTS.md`. A heading would defeat the point.
  "CLAUDE.md",
  "CHANGELOG.md",
  # biome ignores lock files internally, so handing it this one fails the run
  # with "no files were processed" rather than formatting anything.
  "package-lock.json",
  # Build output.
  "main.js",
]
